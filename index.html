<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AnkatsuQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--card:#17171bee;--tx:#f3f1f1;--mu:#a59a9c;--ac:#d4141c;--bd:#3b1519;--ok:#4cc38a;--ko:#ff5a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:radial-gradient(circle at 88% 6%,#8a0d14aa 0,transparent 24%),radial-gradient(ellipse at top,#2a060a 0,var(--bg) 62%) fixed,var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:var(--cloud) 0 0/330px repeat;opacity:.055;pointer-events:none;z-index:-1}.blink{animation:bl .8s steps(2,start) infinite;color:var(--ko)!important}@keyframes bl{50%{opacity:.15}}.badge.open{background:#1c6b45}.qcard{display:flex;gap:12px;align-items:stretch}.qmain{flex:1;min-width:0}.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}.ic{position:relative;width:36px;height:36px;padding:0;margin:0;border-radius:11px;border:1px solid #ffffff18;background:#1c1c22;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s,background .15s}.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.ic.sh{color:#ff6b73}.ic.lk2{color:#ffb84a}.ic.ul{color:#4cc38a}.ic.cp{color:#6ea8ff}.ic:hover{transform:translateY(-1px) scale(1.08);background:#26262d;box-shadow:0 0 14px -2px currentColor}.ic.arm{background:var(--ko);color:#fff}summary.btn{list-style:none;display:inline-block;padding:8px 14px;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;user-select:none}summary.btn::-webkit-details-marker{display:none}.seg{display:inline-flex;gap:4px}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}.cq{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.cq .an{white-space:pre-wrap;margin-top:4px;padding:6px 8px;background:#0b0b0d;border-radius:8px}.pts{display:flex;gap:6px}a{color:#ff6b73}.desc{white-space:pre-wrap;margin:6px 0 12px}.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:4px 9px;margin-right:8px;border-radius:8px;background:#26262d;color:var(--mu);font-size:16px;display:inline-block}.grip:active{cursor:grabbing}[data-i].dragging{opacity:.55;outline:2px dashed var(--ac)}[data-i].over{box-shadow:0 -4px 0 0 var(--ac)}[data-i].overb{box-shadow:0 4px 0 0 var(--ac)}.pt{min-width:46px;padding:8px 0;font-weight:700}.pt.on{background:var(--ac);color:#fff;border-color:var(--ac)}@media (max-width:640px){.cq{flex-direction:column;align-items:stretch}.pts{justify-content:flex-end}}.ic[data-tip]:hover::after{content:attr(data-tip);position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);background:#000;border:1px solid var(--ac);color:#fff;font-size:13px;white-space:nowrap;padding:4px 8px;border-radius:6px;z-index:9;pointer-events:none}.badge.shut{background:#6b1219}.nj{display:block;margin:0 auto 4px}
#app,.brandbar{max-width:1000px;margin:0 auto;padding:16px}.brandbar{padding-bottom:4px}
.brand{display:flex;align-items:center;gap:12px;font-family:'Reggae One','Impact','Arial Black',sans-serif;font-size:34px;letter-spacing:2px;line-height:1;color:var(--ac);text-shadow:0 2px 0 #000,0 0 18px #d4141c88}
.brand img{width:62px;height:auto;margin:0;filter:drop-shadow(0 0 8px #d4141c99)}.brand .q{color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-top:2px solid var(--ac);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 6px 22px #0008}
input,textarea,button,select{font:inherit;color:inherit}
input:not([type=radio]):not([type=checkbox]),textarea,select{width:100%;box-sizing:border-box;padding:9px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:#0b0b0d}
button{padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:#1f1f25;cursor:pointer;margin:2px}
button.pri,.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}button:hover{filter:brightness(1.15)}
.dg{color:var(--ko)}.mu{color:var(--mu)}label{color:var(--mu);font-size:14px;display:block}
label.opt{display:block;color:var(--tx);font-size:17px;padding:12px;border:1px solid var(--bd);border-radius:8px;margin:8px 0;cursor:pointer;background:#0b0b0d}
label.opt:has(input:checked){border-color:var(--ac);background:#2a0a0e}
.tabs{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
summary{cursor:pointer}details.exp{position:relative;display:inline-block}details.exp>div{position:absolute;right:0;z-index:5;background:#1b1b20;border:1px solid var(--bd);border-radius:10px;padding:8px;min-width:230px}details.exp button{display:block;width:100%;text-align:left;margin:4px 0}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.hd h3{margin:2px 0;font-size:22px}.hd .en{margin:6px 0;font-size:18px;white-space:pre-wrap}
.hd #cd{font-size:34px;white-space:nowrap;line-height:1.1}b.warn{color:var(--ko)!important}
.qimg{display:block;width:100%;max-height:min(58vh,640px);object-fit:contain;background:#000;border-radius:10px;margin:10px 0}
.qtl{font-size:13px;color:var(--mu);margin:10px 0}.qtl b{font-size:15px;color:var(--tx)}
#rq{color:var(--ko);margin:6px 0}
.end{text-align:center;padding:28px 16px}.ninja{font-family:'Reggae One','Impact',sans-serif;font-size:42px;margin:6px 0;color:var(--ac);text-shadow:0 2px 0 #000,0 0 22px #d4141c99}.end .big{font-size:22px;margin:4px 0}
@media (min-width:900px){.qg.img{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}.qg.img .qimg{max-height:min(68vh,700px)}}
@media (max-width:640px){#app{padding:8px 0}.brandbar{padding:12px 12px 2px}.brand{font-size:26px}.brand img{width:48px}.card{border-radius:0;border-left:0;border-right:0}.tabs,.row{padding:0 8px}.qimg{width:calc(100% + 32px);max-width:none;max-height:none;margin:10px -16px;border-radius:0}.hd #cd{font-size:28px}.ninja{font-size:34px}}
</style>

<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isQ=q=>(q.type||'qcm')=='qcm',clone=o=>JSON.parse(JSON.stringify(o));
const md=s=>esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const uid8=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const fdate=s=>s?new Date(s).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}):'—';
const newQuiz=()=>({title:'Nouveau quiz',desc:'',minutes:10,qlimit:0,questions:[]});
let db,assets,dl,uid,editor=false,quizzes=[],activeId=null,cur=null,draft=null,RESP=[],quiz=null;
// Étape 1 : adaptateur local autonome. Il sera remplacé par Supabase aux étapes suivantes.
const STORE_KEY='ankatsuquiz_local_v1';
function readStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch(e){return {}}}
function writeStore(data){localStorage.setItem(STORE_KEY,JSON.stringify(data))}
function makeLocalDb(){
  const parts=path=>{const i=path.indexOf('/');return [path.slice(0,i),path.slice(i+1)]};
  return {
    collection(name){return {async get(){const all=readStore()[name]||{};return {docs:Object.entries(all).map(([id,data])=>({id,data:()=>clone(data)}))}}}},
    doc(path){const [col,id]=parts(path);return {
      async get(){const data=(readStore()[col]||{})[id];return {exists:data!==undefined,data:()=>clone(data)}},
      async set(data){const store=readStore();store[col]=store[col]||{};store[col][id]=clone(data);writeStore(store)},
      async update(patch){const store=readStore();store[col]=store[col]||{};if(!Object.prototype.hasOwnProperty.call(store[col],id))throw new Error('Document introuvable');store[col][id]={...store[col][id],...clone(patch)};writeStore(store)},
      async delete(){const store=readStore();if(store[col])delete store[col][id];writeStore(store)}
    }}
  };
}
function nativeDownload(filename,data){const blob=new Blob([data],{type:filename.endsWith('.csv')?'text/csv;charset=utf-8':'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const getQ=id=>quizzes.find(q=>q.id==id),countResp=id=>id?RESP.filter(r=>r['q_'+id]).length:0;
const qlink=id=>location.origin+location.pathname+'?q='+encodeURIComponent(id);
const IC={share:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',unlock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>'};
const isOpen=q=>q.status?q.status=='open':q.id==activeId;
async function setStatus(id,s){try{await db.doc('quizzes/'+id).update({status:s,statusAt:new Date().toISOString()});getQ(id).status=s}catch(e){}}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(er){}ta.remove()}}
function landing(){const open=quizzes.filter(isOpen);const pid=((location.href+' '+document.referrer).match(/[?&#]q=([A-Za-z0-9]+)/)||[])[1];
  if(pid){const q=getQ(pid);if(q&&isOpen(q)){quiz=q;student(false)}else app.innerHTML='<div class="card"><h3>Mission introuvable ou scellée</h3><p class="mu">Demande à ton enseignant un lien à jour, shinobi.</p></div>';return}
  if(open.length==1){quiz=open[0];student(false);return}
  if(!open.length){quiz=null;student(false);return}
  app.innerHTML='<div class="card"><h2 style="margin:0 0 8px">Choisis ta mission</h2>'+open.map(q=>`<button class="pri" data-id="${q.id}" style="display:block;width:100%;margin:8px 0;padding:14px">${esc(q.title)}</button>`).join('')+'</div>';
  app.onclick=e=>{const b=e.target.closest('[data-id]');if(b){quiz=getQ(b.dataset.id);student(false)}}}
async function init(){
  app.innerHTML='<div class="card">Initialisation d’AnkatsuQuiz…</div>';
  try{
    db=makeLocalDb();
    assets={upload(file){return new Promise((resolve,reject)=>{if(!file){reject(new Error('Aucun fichier'));return}if(file.size>1500000){reject(new Error('Image trop volumineuse pour le stockage local (maximum 1,5 Mo).'));return}const reader=new FileReader();reader.onload=()=>resolve({url:reader.result});reader.onerror=()=>reject(new Error('Lecture du fichier impossible'));reader.readAsDataURL(file)})}};
    dl={save({filename,data}){nativeDownload(filename,data);return Promise.resolve()}};
    let storedUid='';try{storedUid=localStorage.getItem('ankatsuquiz_uid')||'';if(!storedUid){storedUid='eleve_'+uid8();localStorage.setItem('ankatsuquiz_uid',storedUid)}}catch(e){storedUid='eleve_'+uid8()}
    uid=storedUid;
    // Mode enseignant temporaire pour tester localement : ?teacher=1. À remplacer par une vraie authentification avant publication.
    editor=new URLSearchParams(location.search).get('teacher')==='1';
    const lg=$('.brand img');if(lg)document.body.style.setProperty('--cloud','url('+lg.src+')');
    await loadQuizzes();
    if(editor){await loadResp();teacher('list')}else{landing()}
  }catch(e){console.error('Erreur d’initialisation AnkatsuQuiz:',e);app.innerHTML='<div class="card"><h2>Impossible de démarrer AnkatsuQuiz</h2><p>Le navigateur n’a pas pu initialiser le stockage local. Vérifiez que le stockage du site est autorisé, puis rechargez la page.</p><p class="mu">Détail technique : '+esc(e?.message||'erreur inconnue')+'</p><button class="pri" onclick="location.reload()">Réessayer</button></div>'}
}
async function loadQuizzes(){
  try{quizzes=(await db.collection('quizzes').get()).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))}catch(e){quizzes=[]}
  try{const a=await db.doc('meta/active').get();activeId=a.exists?a.data().id:null}catch(e){}
  if(editor&&!quizzes.length){try{const o=await db.doc('quiz/main').get();if(o.exists){const d=o.data(),id=uid8(),q={title:d.title||'Mon quiz',minutes:d.minutes||10,qlimit:d.qlimit||0,questions:d.questions||[],createdAt:new Date().toISOString()};await db.doc('quizzes/'+id).set(q);quizzes=[{id,...q}];if(!activeId){activeId=id;await db.doc('meta/active').set({id})}}}catch(e){}}
}
async function loadResp(){try{RESP=(await db.collection('responses').get()).docs.map(d=>({uid:d.id,...d.data()}))}catch(e){RESP=[]}}
function syncHead(){if(draft&&$('#ti')){draft.title=$('#ti').value;draft.desc=$('#de')?$('#de').value:(draft.desc||'');draft.minutes=+$('#mi').value||10;draft.qlimit=Math.max(0,+$('#ql').value||0)}}
function teacher(tab){
  syncHead();
  app.innerHTML=tab!='list'?`<div class="tabs"><button data-t="list">← Mes Quiz</button></div><h2 style="margin:4px 8px 8px">${esc(draft?.title||'Nouveau quiz')}</h2><div class="tabs"><button data-t="edit">Éditer</button><button data-t="resp">Réponses (${countResp(cur)})</button><button data-t="res">Résultats</button><button data-t="test">Tester</button></div><div id="main"></div>`:`<div class="tabs"><button class="on">Mes Quiz</button></div><div id="main"></div>`;
  app.querySelectorAll('[data-t]').forEach(b=>{if(b.dataset.t==(tab=='corr'?'resp':tab))b.className='on';b.onclick=()=>teacher(b.dataset.t)});
  if(tab=='list')list();else if(tab=='edit')edit();else if(tab=='resp')resp();else if(tab=='res')results();else if(tab=='corr')corr();else{quiz=draft;student(true)}
}
function list(){
  const R=$('#main');
  R.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="pri" id="nw">+ Nouveau quiz</button></div>`+(quizzes.length?quizzes.map(q=>`<div class="card qcard" data-id="${q.id}"><div class="qmain"><div class="row" style="padding:0;gap:8px"><h3 style="margin:0">${esc(q.title)}</h3>${isOpen(q)?'<span class="badge open">⚔️ Mission ouverte</span>':'<span class="badge shut">🔒 Mission scellée</span>'}</div><p class="mu">Créé le ${fdate(q.createdAt)} · ${q.questions?.length||0} question(s) · ${q.minutes} min</p><div class="row" style="padding:0"><button data-a="edit">Éditer</button><button data-a="resp">Réponses (${countResp(q.id)})</button><button data-a="test">Tester</button></div><p class="lk mu" style="word-break:break-all;margin:6px 0 0"></p></div><div class="side"><button class="ic sh" data-a="share" data-tip="Copier le lien" aria-label="Copier le lien">${IC.share}</button><button class="ic ${isOpen(q)?'lk2':'ul'}" data-a="tog" data-tip="${isOpen(q)?'Clôturer':'Rouvrir'}" aria-label="${isOpen(q)?'Clôturer':'Rouvrir'}">${isOpen(q)?IC.lock:IC.unlock}</button><button class="ic dg" data-a="del" data-tip="Supprimer" aria-label="Supprimer">${IC.trash}</button></div></div>`).join(''):'<div class="card">Aucun quiz pour le moment. Créez-en un !</div>')+(quizzes.length?'<p class="mu" style="padding:0 8px">Chaque quiz a son propre lien (icône 🔗). Les élèves ne peuvent ouvrir que les missions ouvertes. Une mission scellée n\'accepte plus de réponses.</p>':'');
  R.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id=='nw'){cur=null;draft=newQuiz();teacher('edit');return}
    const c=b.closest('[data-id]');if(!c)return;const id=c.dataset.id,a=b.dataset.a;
    if(a=='edit'||a=='resp'||a=='test'){cur=id;draft=clone(getQ(id));teacher(a)}
    else if(a=='share'){const lk=qlink(id);await copy(lk);list();const l2=document.querySelector('[data-id="'+id+'"] .lk');if(l2)l2.textContent='Lien copié ✔ '+lk+(isOpen(getQ(id))?'':' (mission scellée : réponses fermées)')}
    else if(a=='tog'){await setStatus(id,isOpen(getQ(id))?'closed':'open');list()}
    
    else if(a=='del'){if(!b.dataset.s){b.dataset.s=1;b.classList.add('arm');b.dataset.tip='Cliquer à nouveau pour confirmer';return}
      try{await db.doc('quizzes/'+id).delete();quizzes=quizzes.filter(q=>q.id!=id);
        if(activeId==id){activeId=null;await db.doc('meta/active').set({id:null})}
        for(const r of RESP)if(r['q_'+id]){db.doc('responses/'+r.uid).update({['q_'+id]:null}).catch(()=>{});db.doc('grades/'+gkey(id,r.uid)).delete().catch(()=>{});r['q_'+id]=null}
        if(cur==id){cur=null;draft=null}}catch(er){}
      list()}};
}
function edit(){
  if(!draft)draft=newQuiz();
  const R=$('#main'),d=draft;
  R.innerHTML=`<div class="card"><label>Titre du quiz</label><input id="ti" value="${esc(d.title)}"><label>Description (10 lignes max) — liens possibles : [texte du lien](https://adresse)</label><textarea id="de" rows="5" maxlength="1500" placeholder="Ex : Révise d'abord la [leçon 3](https://exemple.com/lecon3) avant de commencer.">${esc(d.desc||'')}</textarea><label>Compte à rebours total du formulaire (minutes)</label><input id="mi" type="number" min="1" value="${d.minutes}"><label>Limite par question en secondes (0 = aucune ; le temps passé sur chaque question est toujours enregistré)</label><input id="ql" type="number" min="0" value="${d.qlimit||0}"></div><div id="qs"></div><div class="row"><button id="add">+ Question</button><button id="save" class="pri">Enregistrer</button><span id="msg"></span></div>`;
  const msg=t=>$('#msg').textContent=t;$('#de').oninput=e=>{const l=e.target.value.split('\n');if(l.length>10)e.target.value=l.slice(0,10).join('\n')};
  const draw=()=>{$('#qs').innerHTML=d.questions.map((q,i)=>`<div class="card" data-i="${i}"><span class="grip" title="Glisser pour réordonner" aria-label="Glisser pour réordonner">⠿</span><b>Question ${i+1}</b><span style="float:right;display:flex;gap:6px"><button class="ic cp" data-a="dup" data-tip="Dupliquer" aria-label="Dupliquer">${IC.copy}</button><button class="ic dg" data-a="del" data-tip="Supprimer" aria-label="Supprimer">${IC.trash}</button></span><label>Titre de la question</label><input data-f="title" placeholder="Ex : Les fractions" value="${esc(q.title||'')}"><label>Énoncé (facultatif)</label><input data-f="text" value="${esc(q.text||'')}"><label>Type de réponse</label><select data-f="type"><option value="qcm"${isQ(q)?' selected':''}>QCM (choix de réponses)</option><option value="court"${q.type=='court'?' selected':''}>Réponse courte</option><option value="paragraphe"${q.type=='paragraphe'?' selected':''}>Paragraphe (réponse libre)</option></select><label style="display:flex;align-items:center;margin:8px 0"><input type="checkbox" data-f="req"${q.req?' checked':''} style="width:auto;margin:0 6px 0 0"> Réponse obligatoire (impossible de passer à la suite sans répondre)</label>${q.img?`<img class="qimg" style="max-height:240px" src="${esc(q.img)}" alt="">`:''}<button data-a="img">${q.img?'Changer':'Ajouter'} l'image</button>${q.img?'<button data-a="noimg">Retirer l\'image</button>':''}${isQ(q)?`<label>Choix de réponse (un par ligne)</label><textarea data-f="choices" rows="4">${esc((q.choices||[]).join('\n'))}</textarea><label>Numéro de la bonne réponse</label><input data-f="correct" type="number" min="1" value="${(q.correct??0)+1}">`:''}</div>`).join('')};
  $('#qs').oninput=e=>{const c=e.target.closest('[data-i]'),f=e.target.dataset.f;if(!c||!f)return;const q=d.questions[c.dataset.i];
    if(f=='choices')q.choices=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean);else if(f=='correct')q.correct=Math.max(0,(+e.target.value||1)-1);
    else if(f=='type'){q.type=e.target.value;draw()}else if(f=='req')q.req=e.target.checked;else if(f=='title')q.title=e.target.value;else q.text=e.target.value};
  $('#qs').onclick=e=>{const c=e.target.closest('[data-i]'),a=e.target.closest('[data-a]')?.dataset.a;if(!c||!a)return;const i=+c.dataset.i;if(a=='dup'){d.questions.splice(i+1,0,clone(d.questions[i]));draw();return}
    if(a=='del'){d.questions.splice(i,1);draw()}
    if(a=='noimg'){d.questions[i].img='';draw()}
    if(a=='img'){if(!assets){msg('Upload indisponible');return}const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.onchange=async()=>{try{const r=await assets.upload(inp.files[0]);d.questions[i].img=r.url;draw()}catch(er){msg('Échec de l\'upload')}};inp.click()}};
  let dg=null;const cards=()=>[...$('#qs').children];
  $('#qs').addEventListener('pointerdown',e=>{const g=e.target.closest('.grip');if(!g)return;e.preventDefault();const c=g.closest('[data-i]'),i=+c.dataset.i;dg={from:i,to:i};c.classList.add('dragging');try{g.setPointerCapture(e.pointerId)}catch(er){}});
  $('#qs').addEventListener('pointermove',e=>{if(!dg)return;const els=cards();let to=els.length-1;for(let k=0;k<els.length;k++){const r=els[k].getBoundingClientRect();if(e.clientY<r.top+r.height/2){to=k;break}}dg.to=to;els.forEach((x,k)=>{x.classList.toggle('over',k==to&&to<dg.from);x.classList.toggle('overb',k==to&&to>dg.from)});if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>innerHeight-70)window.scrollBy(0,14)});
  const dend=e=>{if(!dg)return;const {from,to}=dg;dg=null;if(to!=from&&e.type=='pointerup'){const [m]=d.questions.splice(from,1);d.questions.splice(to,0,m)}draw()};
  $('#qs').addEventListener('pointerup',dend);$('#qs').addEventListener('pointercancel',dend);
  $('#add').onclick=()=>{d.questions.push({type:'qcm',title:'',text:'',img:'',choices:[],correct:0});draw()};
  $('#save').onclick=async()=>{syncHead();
    try{const now=new Date().toISOString();if(!cur){cur=uid8();d.createdAt=now;d.status='open'}if(!d.status)d.status=(activeId==cur)?'open':'closed';d.updatedAt=now;
      const {id,...data}=d;await db.doc('quizzes/'+cur).set(data);
      const item={...data,id:cur},k=quizzes.findIndex(x=>x.id==cur);k<0?quizzes.unshift(item):quizzes[k]=item;d.id=cur;
      
      msg('Enregistré ✔')}catch(e){msg('Erreur d\'enregistrement')}};
  draw();
}
function student(test){
  const R=$('#main')||app;
  if(!quiz||!quiz.questions?.length){R.innerHTML='<div class="card"><h3>Aucune mission disponible</h3><p class="mu">Revenez plus tard, shinobi.</p></div>';return}
  R.innerHTML=`<div class="card"><h2 style="margin:0 0 4px">${esc(quiz.title)}</h2>${quiz.desc?`<div class="desc">${md(quiz.desc.split('\n').slice(0,10).join('\n'))}</div>`:''}<p class="mu">${quiz.questions.length} question(s) · ${quiz.minutes} min</p><label>Prénom</label><input id="nm" autocomplete="given-name"><button id="go" class="pri">Commencer la mission</button></div>`;
  $('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n&&!test){$('#nm').focus();return}run(R,n||'Test',test)};
}
function run(R,name,test){
  const Q=quiz.questions,ans=[];let i=0,t0=Date.now(),done=false;const end=Date.now()+quiz.minutes*60000;
  const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  const fe=ms=>String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');
  const qi=q=>isQ(q)?(q.choices||[]).map((c,k)=>`<label class="opt"><input type="radio" name="c" value="${k}"> ${esc(c)}</label>`).join(''):q.type=='court'?'<textarea id="ta" rows="3" data-max="6" placeholder="Réponse courte (6 lignes max)"></textarea>':'<textarea id="ta" rows="7" placeholder="Votre réponse"></textarea>';
  const show=()=>{const q=Q[i],hT=!!(q.title||'').trim(),hE=!!(q.text||'').trim(),st=q.req?' *':'';
    R.innerHTML=`<div class="card"><div class="hd"><div><small class="mu">Question ${i+1}/${Q.length}</small>${hT?`<h3>${esc(q.title)}${hE?'':st}</h3>`:''}${hE?`<p class="en">${esc(q.text)}${hT?'':st}</p>`:''}</div><b id="cd"></b></div><div class="qg${q.img?' img':''}">${q.img?`<div><img class="qimg" src="${esc(q.img)}" alt=""></div>`:''}<div class="qa"><div class="qtl">${quiz.qlimit?'Temps restant pour cette question':'Temps passé sur cette question'} : <b id="qt">0:00</b></div>${qi(q)}<p id="rq"></p><button id="nx" class="pri">${i==Q.length-1?'Terminer':'Suivant'}</button></div></div></div>`;
    const ta=$('#ta');if(ta&&ta.dataset.max)ta.oninput=()=>{const l=ta.value.split('\n');if(l.length>6)ta.value=l.slice(0,6).join('\n')};t0=Date.now();$('#nx').onclick=()=>next();window.scrollTo(0,0)};
  const rec=()=>{const q=Q[i],ms=Date.now()-t0;if(isQ(q)){const s=document.querySelector('input[name=c]:checked');ans[i]={c:s?+s.value:-1,ms}}else ans[i]={c:-1,t:($('#ta')?.value||'').slice(0,5000),ms}};
  const has=()=>isQ(Q[i])?!!document.querySelector('input[name=c]:checked'):!!($('#ta')?.value||'').trim();
  const next=force=>{if(force!==true&&Q[i].req&&!has()){const m=$('#rq');if(m)m.textContent='Cette question est obligatoire.';return}rec();if(force===true&&emptyA(ans[i]))ans[i].to=1;if(i<Q.length-1){i++;show()}else finish()};
  const finish=async()=>{if(done)return;done=true;clearInterval(tm);for(let k=0;k<Q.length;k++)ans[k]=ans[k]||{c:-1,ms:0,to:1};
    const gq=Q.filter(isQ).length,score=ans.filter((a,k)=>isQ(Q[k])&&a.c==Q[k].correct).length;
    const doc={name,answers:ans,score,total:gq,totalMs:ans.reduce((s,a)=>s+a.ms,0),at:new Date().toISOString()};
    R.innerHTML=`<div class="card end"><svg class="nj" viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><circle cx="32" cy="34" r="22" fill="#0e0e12" stroke="#d4141c" stroke-width="2"/><rect x="12" y="28" width="40" height="12" rx="6" fill="#e9c9a8"/><circle cx="24" cy="34" r="2.6" fill="#0e0e12"/><circle cx="40" cy="34" r="2.6" fill="#0e0e12"/><rect x="10" y="18" width="44" height="8" rx="3" fill="#d4141c"/><rect x="24" y="17" width="16" height="10" rx="2" fill="#bfc3c9"/><path d="M52 22 L62 14 M52 24 L63 22" stroke="#d4141c" stroke-width="3" stroke-linecap="round"/></svg><h1 class="ninja">Mission accomplie</h1><p class="big">Bien joué, ${esc(name)} !</p><p class="mu">Chaque épreuve te rend plus fort. Continue à t'entraîner : la voie du shinobi se construit pas à pas.</p>${gq?`<p>Score QCM : <b>${score}/${gq}</b></p>`:''}<p id="st" class="mu"></p></div>`;
    if(test){$('#st').textContent='Mode test : rien n\'est enregistré.';return}
    const send=async()=>{$('#st').textContent='Transmission au village…';const key='q_'+quiz.id,ref=db.doc('responses/'+uid);
      try{const cs=await db.doc('quizzes/'+quiz.id).get();if(cs.exists&&cs.data().status=='closed'){$('#st').textContent='Cette mission est scellée : tes réponses ne sont plus acceptées.';return}try{await ref.update({[key]:doc})}catch(e){await ref.set({[key]:doc})}$('#st').textContent='Réponses transmises ✔'}
      catch(e){$('#st').innerHTML='Échec de l\'envoi. <button id="rt">Renvoyer</button>';$('#rt').onclick=send}};
    send()};
  const tm=setInterval(()=>{const r=end-Date.now(),c=$('#cd'),e=Date.now()-t0,L=(quiz.qlimit||0)*1000,qt=$('#qt');
    if(c){c.textContent=fmt(r);c.className=r<=10000?'warn':''}
    if(qt){qt.textContent=L?fmt(L-e):fe(e);qt.className=L&&L-e<=0&&i==Q.length-1?'blink':(L&&L-e<=10000?'warn':'')}
    if(r<=0&&!done){if(!ans[i]){rec();if(emptyA(ans[i]))ans[i].to=1}finish()}else if(L&&e>=L&&!done&&i<Q.length-1)next(true)},250);
  show();
}
let GR={},sortDir=null;
const emptyA=a=>a.c<0&&!(a.t||'').trim(),mark=a=>a.to?'<b class="dg">✕</b> <span class="mu">temps écoulé</span>':'<span class="mu">–</span>';
const gkey=(qid,u)=>qid+'_'+u,fmtN=n=>String(Math.round(n*10)/10).replace('.',','),noteOf=p=>p&&p.some(v=>v!=null)?p.reduce((s,v)=>s+(+v||0),0):null;
async function loadGr(){GR={};try{(await db.collection('grades').get()).docs.forEach(d=>GR[d.id]=d.data())}catch(e){}}
const rowsOf=qid=>RESP.filter(r=>r['q_'+qid]).map(r=>{const a=r['q_'+qid],g=GR[gkey(qid,r.uid)],ok=g&&g.forAt==a.at;return {...a,uid:r.uid,pts:ok?g.pts:null,note:ok?noteOf(g.pts):null}}).sort((x,y)=>(y.at||'').localeCompare(x.at||''));
async function setPt(r,k,p,qid){const id=gkey(qid,r.uid);let g=GR[id];if(!g||g.forAt!=r.at)g={pts:[],forAt:r.at,name:r.name,quiz:qid};while(g.pts.length<=k)g.pts.push(null);g.pts[k]=p;GR[id]=g;r.pts=g.pts;r.note=noteOf(g.pts);await db.doc('grades/'+id).set(g)}
async function results(){
  const R=$('#main');R.innerHTML='<div class="card">Chargement…</div>';await loadResp();await loadGr();
  const q=getQ(cur);if(!q){R.innerHTML='<div class="card">Quiz introuvable.</div>';return}
  const rows=rowsOf(cur),nq=(q.questions||[]).length;
  const draw=()=>{let L=[...rows].sort((a,b)=>String(a.name).localeCompare(String(b.name)));
    if(sortDir)L.sort((a,b)=>{const x=a.note??-1,y=b.note??-1;return sortDir=='d'?y-x:x-y});
    const arrow=sortDir=='d'?'<path d="M12 5v14M6 13l6 6 6-6"/>':sortDir=='a'?'<path d="M12 19V5M6 11l6-6 6 6"/>':'<path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4"/>';
    R.innerHTML=`<div class="card"><h2 style="margin:0 0 4px">${esc(q.title)}</h2><p class="mu" style="margin:0">Résultats · ${rows.length} participant(s) · ${rows.filter(r=>r.note!=null).length} corrigé(s)</p><div class="row" style="padding:0;margin-top:10px"><button class="pri" id="gc">✎ Corriger les réponses</button></div></div><div class="card tw"><table><tr><th style="width:56px">N°</th><th>Shinobi</th><th>Note <button class="ic" id="so" data-tip="${sortDir=='d'?'Du plus grand au plus petit':sortDir=='a'?'Du plus petit au plus grand':'Trier par note'}" aria-label="Trier par note" style="display:inline-flex;width:28px;height:28px;vertical-align:middle;margin-left:6px"><svg viewBox="0 0 24 24">${arrow}</svg></button></th></tr>${L.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.note==null?'<span class="mu">—</span>':`<b>${fmtN(r.note)}</b> <span class="mu">/ ${nq}</span>`}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">Aucune réponse pour le moment.</td></tr>'}</table></div>`;
    $('#so').onclick=()=>{sortDir=sortDir=='d'?'a':'d';draw()};$('#gc').onclick=()=>teacher('corr')};
  draw();
}
async function corr(){
  const R=$('#main');R.innerHTML='<div class="card">Chargement…</div>';await loadResp();await loadGr();
  const q=getQ(cur);if(!q){R.innerHTML='<div class="card">Quiz introuvable.</div>';return}
  const Q=q.questions||[],rows=rowsOf(cur).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const ans=(r,k)=>{const qq=Q[k],a=r.answers?.[k]||{c:-1};if(emptyA(a))return a.to?'✕ temps écoulé':'–';return isQ(qq)?(a.c>=0?qq.choices?.[a.c]:'—'):(a.t||'—')};
  const btns=v=>[0,0.5,1].map(p=>`<button class="pt${v===p?' on':''}" data-p="${p}">${fmtN(p)}</button>`).join('');
  const item=r=>`<details class="card" data-u="${r.uid}"><summary><b>${esc(r.name)}</b> · Note : <span class="nt">${r.note==null?'—':fmtN(r.note)}</span> / ${Q.length}</summary>${Q.map((qq,k)=>`<div class="cq" data-k="${k}"><div style="min-width:0"><b>${k+1}. ${esc(qq.title||qq.text)}</b>${isQ(qq)&&(qq.choices||[])[qq.correct]!=null?`<div class="mu">Bonne réponse : ${esc(qq.choices[qq.correct])}</div>`:''}<div class="an">${esc(ans(r,k))}</div></div><div class="pts">${btns(r.pts?.[k])}</div></div>`).join('')}</details>`;
  R.innerHTML=`<div class="card"><h2 style="margin:0 0 4px">${esc(q.title)}</h2><p class="mu" style="margin:0 0 10px">Correction : attribuez 0, 0,5 ou 1 point à chaque réponse.</p><div class="row" style="padding:0"><button id="auto">⚡ Corriger les QCM automatiquement</button><button id="bk">Voir les résultats</button></div><p id="cm" class="mu"></p></div>${rows.length?rows.map(item).join(''):'<div class="card">Aucune réponse à corriger.</div>'}`;
  R.onclick=async e=>{
    if(e.target.id=='bk'){teacher('res');return}
    if(e.target.id=='auto'){$('#cm').textContent='Correction en cours…';
      try{for(const r of rows)for(let k=0;k<Q.length;k++){const qq=Q[k];if(isQ(qq)&&r.pts?.[k]==null){const a=r.answers?.[k]||{c:-1};await setPt(r,k,a.c==qq.correct?1:0,cur)}}corr()}catch(er){$('#cm').textContent='Erreur de sauvegarde'}return}
    const b=e.target.closest('.pt');if(!b)return;const c=b.closest('.cq'),d=b.closest('[data-u]'),r=rows.find(x=>x.uid==d.dataset.u),k=+c.dataset.k,p=+b.dataset.p;
    try{await setPt(r,k,p,cur);c.querySelectorAll('.pt').forEach(x=>x.classList.toggle('on',+x.dataset.p===p));d.querySelector('.nt').textContent=fmtN(r.note)}catch(er){$('#cm').textContent='Erreur de sauvegarde'}};
}
const matrix=(Q,rows)=>{const h=['Prénom','Date','Score QCM','Total QCM','Temps total (s)','Note'];Q.forEach((q,k)=>{const n='Q'+(k+1);h.push(n+' réponse',n+' correct',n+' temps (s)',n+' points')});
  const out=[h];rows.forEach(r=>{const l=[r.name,fdate(r.at),r.score,r.total,+(r.totalMs/1000).toFixed(1),r.note??''];
    Q.forEach((q,k)=>{const a=r.answers?.[k]||{c:-1,ms:0};l.push(emptyA(a)?(a.to?'✕':'–'):(isQ(q)?(q.choices?.[a.c]??''):(a.t||'')),isQ(q)?(a.c==q.correct?'oui':'non'):'',+(a.ms/1000).toFixed(1),r.pts?.[k]??'')});out.push(l)});return out};
async function resp(){
  const R=$('#main');R.innerHTML='<div class="card">Chargement…</div>';await loadResp();await loadGr();
  if(!quizzes.length){R.innerHTML='<div class="card">Créez d\'abord un quiz.</div>';return}
  if(!getQ(cur))cur=quizzes[0].id;
  const q=getQ(cur),Q=q.questions||[],rows=rowsOf(cur);
  const tb=$('[data-t=resp]');if(tb)tb.textContent=`Réponses (${rows.length})`;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,nq=Q.filter(isQ).length;
  const qs=Q.map((qq,k)=>{const as=rows.map(r=>r.answers?.[k]).filter(Boolean),ok=as.filter(a=>a.c==qq.correct).length,dist=(qq.choices||[]).map((c,j)=>as.filter(a=>a.c==j).length);
    return `<tr><td>${k+1}. ${esc(qq.title||qq.text)}</td><td>${isQ(qq)?Math.round(100*ok/(as.length||1))+'%':'—'}</td><td>${(avg(as.map(a=>a.ms))/1000).toFixed(1)} s</td><td>${isQ(qq)?dist.map((n,j)=>`${j+1}: ${n}`).join(' · '):as.filter(a=>a.t).length+' réponse(s) libre(s)'}</td></tr>`}).join('');
  const det=r=>`<details class="card"><summary><b>${esc(r.name)}</b> · ${r.total?r.score+'/'+r.total:'—'} · ${(r.totalMs/1000).toFixed(0)} s · <span class="mu">${fdate(r.at)}</span></summary><div class="tw"><table><tr><th>Question</th><th>Réponse</th><th></th><th>Temps</th></tr>${Q.map((qq,k)=>{const a=r.answers?.[k]||{c:-1,ms:0};return `<tr><td>${k+1}. ${esc(qq.title||qq.text)}</td><td style="white-space:pre-wrap">${emptyA(a)?mark(a):esc(isQ(qq)?qq.choices?.[a.c]:a.t)}</td><td>${isQ(qq)?(a.c==qq.correct?'✔':'✘'):''}</td><td>${(a.ms/1000).toFixed(1)} s</td></tr>`}).join('')}</table></div></details>`;
  R.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;padding:0"><div class="seg"><button data-v="g">Vue globale</button><button data-v="n">Par prénom (${rows.length})</button></div><div class="row" style="padding:0;gap:8px"><button id="gocorr" class="pri">✎ Corriger</button><details class="exp"><summary class="btn">⬇ Exporter ▾</summary><div><button id="e-csv">Fichier CSV</button><button id="e-xls">Fichier Excel (.xlsx)</button><button id="e-gs">Copier pour Google Sheets</button></div></details></div></div><p id="xm" class="mu"></p>${rows.length?`<b>${rows.length} élève(s)</b> · score moyen ${avg(rows.map(r=>r.score)).toFixed(1)}/${nq} (QCM) · temps moyen ${(avg(rows.map(r=>r.totalMs))/1000).toFixed(0)} s`:'Aucune réponse pour le moment.'}</div><div id="rv"></div>`;
  const view=v=>{R.querySelectorAll('[data-v]').forEach(b=>b.className=b.dataset.v==v?'on':'');$('#rv').innerHTML=!rows.length?'':v=='g'?`<div class="card tw"><table><tr><th>Question</th><th>Réussite</th><th>Temps moyen</th><th>Choix (n° : effectif)</th></tr>${qs}</table></div>`:[...rows].sort((x,y)=>String(x.name).localeCompare(String(y.name))).map(det).join('')};
  R.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));view('g');$('#gocorr').onclick=()=>teacher('corr');
  const xm=t=>$('#xm').textContent=t,M=()=>matrix(Q,rows),slug=(q.title||'quiz').replace(/[^\w\-]+/g,'_');
  const q1=s=>{s=String(s??'');if(/^[=+\-@]/.test(s)&&isNaN(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const save=async(fn,data)=>{try{await dl.save({filename:fn,data});xm('Fichier prêt ✔')}catch(e){xm('Échec du téléchargement ('+(e?.code||e?.message||'erreur')+')')}};
  $('#e-csv').onclick=()=>save(slug+'.csv','\ufeff'+M().map(l=>l.map(q1).join(';')).join('\r\n'));
  $('#e-xls').onclick=()=>{if(!window.XLSX){xm('Excel indisponible, utilisez le CSV');return}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(M()),'Réponses');save(slug+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))};
  $('#e-gs').onclick=async()=>{const t=M().map(l=>l.map(c=>String(c??'').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
    try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(er){}ta.remove()}
    xm('Copié ✔ Ouvrez un Google Sheets vide et collez avec Ctrl+V (Cmd+V sur Mac).')};
}
init();
</script></body></html>
